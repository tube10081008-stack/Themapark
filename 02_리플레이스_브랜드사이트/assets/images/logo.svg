<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" class="replayce-logo">
  <defs>
    <linearGradient id="logo-coral-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B57"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    <linearGradient id="logo-lime-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16"/>
      <stop offset="100%" stop-color="#0F3E36"/>
    </linearGradient>
  </defs>
  
  <!-- Icon Symbol: A dynamic arch pathway representing revitalized space and jumping child joy -->
  <g transform="translate(4, 8)">
    <!-- Base track/pathway -->
    <path d="M4 38 C 12 18, 28 10, 42 22 C 50 28, 54 38, 54 38" stroke="#0E1E38" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Ascending vibrant curve of play -->
    <path d="M12 40 C 20 22, 34 16, 46 26" stroke="url(#logo-coral-yellow)" stroke-width="4" stroke-linecap="round"/>
    <!-- Jumping joy ball / energy orb -->
    <circle cx="36" cy="10" r="6" fill="#FFB800"/>
    <circle cx="20" cy="18" r="3.5" fill="#FF6B57"/>
  </g>

  <!-- Wordmark "RE:PLAYCE" -->
  <g transform="translate(70, 42)">
    <!-- RE -->
    <text font-family="'Pretendard', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#0E1E38" letter-spacing="-0.5">RE</text>
    
    <!-- Dynamic Playful Colon ':' -->
    <circle cx="48" cy="-17" r="3.5" fill="#FF6B57"/>
    <circle cx="48" cy="-7" r="3.5" fill="#FFB800"/>
    
    <!-- PLAYCE -->
    <text x="58" font-family="'Pretendard', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#0E1E38" letter-spacing="-0.5">PLAYCE</text>
  </g>

  <!-- Subtitle Tag -->
  <text x="72" y="58" font-family="'Pretendard', system-ui, sans-serif" font-weight="600" font-size="8.5" fill="#0F3E36" letter-spacing="1.5">PUBLIC LEISURE ASSET REVITALIZATION</text>
</svg>
