<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>리틀포레스트 봉뜨락 · 3D 메타버스</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
  <style>
    :root { --panel: rgba(12, 18, 32, .82); --line: rgba(148, 163, 184, .22); --txt: #e2e8f0; --sub: #94a3b8; --acc: #22c55e; }
    * { box-sizing: border-box; font-family: 'Pretendard', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1220; color: var(--txt); word-break: keep-all; user-select: none; -webkit-user-select: none; }
    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .card { position: fixed; left: 16px; top: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; backdrop-filter: blur(8px); max-width: calc(100vw - 32px); }
    .card h1 { margin: 0; font-size: 15px; font-weight: 900; }
    .card .titlerow { display: flex; align-items: center; gap: 8px; }
    .card .homebtn { flex: none; text-decoration: none; font-size: 12px; font-weight: 800; color: var(--txt); background: rgba(148, 163, 184, .16); border: 1px solid var(--line); padding: 4px 9px; border-radius: 10px; }
    .card .homebtn:hover { background: rgba(148, 163, 184, .3); }
    .card p { margin: 2px 0 0; font-size: 12px; color: var(--sub); }
    .card .place { display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 800; color: #04110a; background: var(--acc); padding: 2px 8px; border-radius: 999px; }
    .bar { position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .grp { display: flex; align-items: center; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 4px; backdrop-filter: blur(8px); }
    .grp span { font-size: 11px; color: var(--sub); padding: 0 6px; white-space: nowrap; }
    .grp button { border: 0; background: transparent; color: var(--sub); font-weight: 800; font-size: 12px; padding: 7px 10px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
    .grp button.on { background: var(--acc); color: #04110a; }
    .label { position: fixed; left: 0; top: 0; pointer-events: none; font-size: 12px; font-weight: 800; color: #0f172a; background: rgba(255, 255, 255, .92); padding: 3px 8px; border-radius: 999px; box-shadow: 0 2px 8px rgba(0, 0, 0, .25); white-space: nowrap; }
    .label.door { background: #22c55e; color: #04110a; }
    .label.me { background: #fde047; }
    #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .28s ease; }
    #toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); background: rgba(12, 18, 32, .9); border: 1px solid var(--line); padding: 10px 16px; border-radius: 14px; font-weight: 800; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; }
    #joy { position: fixed; left: 22px; bottom: max(22px, env(safe-area-inset-bottom)); width: 128px; height: 128px; border-radius: 50%; background: rgba(12, 18, 32, .45); border: 2px solid rgba(255, 255, 255, .18); display: none; touch-action: none; }
    #joy i { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(255, 255, 255, .85); box-shadow: 0 2px 10px rgba(0, 0, 0, .3); }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--sub); }
    @media (max-width: 640px) { .grp span { display: none; } .grp button { padding: 7px 8px; } .card p { display: none; } }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="stage"></div>
  <div id="loading">봉뜨락을 짓는 중…</div>
  <div class="card">
    <div class="titlerow">
      <a href="../index.html" class="homebtn" title="메인 포털로 돌아가기">← 메인</a>
      <h1>리틀포레스트 봉뜨락 · 3D 메타버스</h1>
    </div>
    <p>WASD·방향키(휴대폰: 왼쪽 조이스틱)로 이동 · 드래그로 시점 회전 · 휠/핀치 확대</p>
    <span class="place" id="placeName">야외</span>
  </div>
  <div id="labels"></div>
  <div id="joy"><i></i></div>
  <div id="toast"></div>
  <div id="fade"></div>
  <div class="bar">
    <div class="grp" id="gPitch"><span>시점</span><button data-v="35">35°</button><button data-v="50" class="on">50°</button><button data-v="70">70°</button></div>
    <div class="grp" id="gTilt"><span>미니어처</span><button data-v="0">끔</button><button data-v="1" class="on">1</button><button data-v="2">2</button></div>
    <div class="grp" id="gTime"><span>시간</span><button data-v="day" class="on">낮</button><button data-v="dusk">노을</button></div>
    <div class="grp" id="gMisc"><button data-v="labels" class="on">이름표</button><button data-v="aa">고화질</button></div>
  </div>

  <script type="module">
    /* ================================================================
       봉뜨락 복셀 메타버스 (시험판)
       ----------------------------------------------------------------
       · 야외 맵: 조감도 기준 (무지개 벽화 지붕 놀이동, 원형 무지개 파빌리온, 보라 짚코스터,
                  파란 네트챌린지, 북쪽 주차장, 남·동쪽 순환 도로, 숲)
       · 실내 맵: 놀이동 입구로 걸어 들어가면 전환 (체크 매트, 흰 소프트플레이 3층, 닌자 코스, 트램펄린)
       · 렌더링 기법은 Dramatic Shape Voxel Mod 를 벤치마킹 (코드 미사용 — 라이선스 없음)
         ① 도트 타일을 면에 1:1  ② 꼭짓점 AO  ③ 면 방향별 명암  ④ 선명한 그림자 + 틸트시프트
       · 모든 타일 그림은 이 파일 안에서 직접 그림. 분석: docs/metaverse_voxel_benchmark.md
       ================================================================ */
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    /* ================= 0. 유틸 ================= */
    function rng(seed) {
      let a = seed >>> 0;
      return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    }
    const pick = (r, arr) => arr[Math.floor(r() * arr.length) % arr.length];
    const shade = (hex, f) => { const n = parseInt(hex.slice(1), 16); const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(v * f)))); return '#' + c.map(v => v.toString(16).padStart(2, '0')).join(''); };

    /* ================= 1. 도트 타일 아틀라스 ================= */
    const TS = 16, COLS = 16, ATLAS = TS * COLS;
    const atlasCanvas = document.createElement('canvas'); atlasCanvas.width = atlasCanvas.height = ATLAS;
    const actx = atlasCanvas.getContext('2d');
    function tile(index, painter) {
      const ox = (index % COLS) * TS, oy = Math.floor(index / COLS) * TS;
      const r = rng(index * 104729 + 17);
      const p = (x, y, c) => { if (x < 0 || y < 0 || x >= TS || y >= TS) return; actx.fillStyle = c; actx.fillRect(ox + x, oy + y, 1, 1); };
      const fill = (c) => { actx.fillStyle = c; actx.fillRect(ox, oy, TS, TS); };
      const rect = (x, y, w, h, c) => { actx.fillStyle = c; actx.fillRect(ox + x, oy + y, w, h); };
      const speck = (cols, d) => { for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) if (r() < d) p(x, y, pick(r, cols)); };
      painter({ p, fill, rect, speck, r });
    }
    const T = {}; let tIdx = 0;
    const def = (name, painter) => { T[name] = tIdx; tile(tIdx, painter); tIdx++; };
    const GRASS = ['#6cbf4a', '#79c955', '#5eae40', '#86d15f'], DIRT = ['#8a5a3b', '#7b4f33', '#9a6746', '#6f4730'];

    def('grass', ({ fill, speck, p, r }) => { fill('#6cbf4a'); speck(['#79c955', '#5eae40', '#86d15f'], .32); for (let i = 0; i < 9; i++) { const x = Math.floor(r() * 16), y = Math.floor(r() * 15); p(x, y, '#4f9a35'); p(x, y + 1, '#58a63c'); } for (let i = 0; i < 5; i++) p(Math.floor(r() * 16), Math.floor(r() * 16), '#a6e07a'); });
    def('grassSide', ({ fill, speck, p, r }) => { fill('#8a5a3b'); speck(DIRT, .35); for (let i = 0; i < 4; i++) { const x = Math.floor(r() * 15), y = 7 + Math.floor(r() * 8); p(x, y, '#a8a29e'); p(x + 1, y, '#78716c'); } for (let x = 0; x < 16; x++) { const d = 3 + (r() < .45 ? 1 : 0) + (r() < .2 ? 1 : 0); for (let y = 0; y < d; y++) p(x, y, pick(r, GRASS)); p(x, d, '#4f8a33'); } });
    def('dirt', ({ fill, speck, p, r }) => { fill('#8a5a3b'); speck(DIRT, .4); for (let i = 0; i < 5; i++) { const x = Math.floor(r() * 15), y = Math.floor(r() * 16); p(x, y, '#a8a29e'); p(x + 1, y, '#78716c'); } });
    def('path', ({ fill, speck, p, r }) => { fill('#d9c7a4'); speck(['#cbb893', '#e6d6b5', '#c2ad86'], .36); for (let i = 0; i < 4; i++) { const x = Math.floor(r() * 14), y = Math.floor(r() * 14); p(x, y, '#b3a288'); p(x + 1, y + 1, '#9c8c74'); } });
    def('deck', ({ rect, p, r }) => { for (let k = 0; k < 4; k++) { const base = pick(r, ['#b67d47', '#a8703d', '#bf8753', '#b0773f']); rect(0, k * 4, 16, 4, base); rect(0, k * 4 + 3, 16, 1, '#6b4526'); for (let i = 0; i < 4; i++) rect(Math.floor(r() * 12), k * 4 + 1 + Math.floor(r() * 2), 2 + Math.floor(r() * 3), 1, '#94613a'); const seam = (k % 2 ? 11 : 4); rect(seam, k * 4, 1, 3, '#6b4526'); p(seam - 2, k * 4 + 1, '#5a3a20'); rect(0, k * 4, 16, 1, '#c8935f'); } });
    def('plaster', ({ fill, speck, rect }) => { fill('#f3eee2'); speck(['#ebe4d3', '#faf7ef'], .25); rect(0, 15, 16, 1, '#ddd4bf'); });
    def('window', ({ fill, rect, p }) => { fill('#f3eee2'); rect(2, 2, 12, 12, '#475569'); rect(3, 3, 10, 10, '#6fb2d6'); rect(3, 3, 10, 4, '#8fcbe8'); rect(8, 3, 1, 10, '#475569'); rect(3, 8, 10, 1, '#475569'); p(4, 4, '#e8f7ff'); p(5, 4, '#e8f7ff'); p(4, 5, '#e8f7ff'); rect(1, 13, 14, 1, '#ffffff'); });
    def('door', ({ fill, rect, p }) => { fill('#f3eee2'); rect(2, 1, 12, 15, '#475569'); rect(3, 2, 10, 14, '#7c8a9c'); rect(4, 3, 8, 6, '#8fcbe8'); p(11, 10, '#f2c14e'); });
    def('wood', ({ rect, p, r }) => { for (let x = 0; x < 16; x += 4) { rect(x, 0, 4, 16, pick(r, ['#9c6a3e', '#a8744a', '#8f5f37'])); rect(x + 3, 0, 1, 16, '#6b4526'); rect(x, 0, 1, 16, '#b8845a'); for (let i = 0; i < 3; i++) p(x + 1 + Math.floor(r() * 2), Math.floor(r() * 16), '#7d5130'); } });
    def('stone', ({ fill, rect, p, r }) => { fill('#6b7280'); for (let row = 0; row < 4; row++) { const off = row % 2 ? 4 : 0; for (let x = -off; x < 16; x += 8) { rect(x + 1, row * 4 + 1, 7, 3, pick(r, ['#9ca3af', '#a3aab4', '#8f969f'])); rect(x + 1, row * 4 + 1, 7, 1, '#c3c9d1'); } } for (let i = 0; i < 4; i++) p(Math.floor(r() * 16), Math.floor(r() * 16), '#7c838d'); });
    def('pine', ({ fill, speck, p, r }) => { fill('#2f6b3a'); speck(['#3c8547', '#245430', '#357a42', '#1f4a2a'], .5); for (let i = 0; i < 6; i++) { const x = Math.floor(r() * 15), y = Math.floor(r() * 15); p(x, y, '#4f9a58'); p(x + 1, y, '#4f9a58'); } });
    def('leaf', ({ fill, speck, p, r }) => { fill('#4f9a3c'); speck(['#62b04a', '#3d7d2e', '#58a642', '#35702a'], .5); for (let i = 0; i < 5; i++) p(Math.floor(r() * 16), Math.floor(r() * 16), '#8fd46f'); });
    def('apple', ({ fill, speck, p, r }) => { fill('#4f9a3c'); speck(['#62b04a', '#3d7d2e', '#58a642'], .5); for (let i = 0; i < 3; i++) { const x = 1 + Math.floor(r() * 13), y = 1 + Math.floor(r() * 13); p(x, y, '#d93b3b'); p(x + 1, y, '#c02f2f'); p(x, y + 1, '#c02f2f'); p(x + 1, y + 1, '#a82424'); p(x, y, '#ff8a80'); } });
    def('trunk', ({ fill, rect, p, r }) => { fill('#7a4e2d'); for (let x = 0; x < 16; x += 3) rect(x, 0, 1, 16, '#5e3a20'); for (let i = 0; i < 10; i++) p(Math.floor(r() * 16), Math.floor(r() * 16), '#946038'); });
    def('asphalt', ({ fill, speck }) => { fill('#4a4f57'); speck(['#545962', '#3f444b', '#5e636c'], .45); });
    def('line', ({ fill, speck, rect }) => { fill('#4a4f57'); speck(['#545962', '#3f444b'], .45); rect(7, 0, 2, 16, '#eceef1'); });
    def('roadLine', ({ fill, speck, rect }) => { fill('#4a4f57'); speck(['#545962', '#3f444b'], .45); rect(7, 2, 2, 12, '#f6c744'); });
    def('sign', ({ fill, rect, p }) => { fill('#e2e8f0'); rect(1, 1, 14, 14, '#16a34a'); rect(1, 1, 14, 1, '#22c55e'); rect(7, 9, 2, 4, '#fff'); rect(5, 7, 6, 2, '#fff'); rect(6, 5, 4, 2, '#fff'); rect(7, 3, 2, 2, '#fff'); p(11, 4, '#fde047'); p(12, 3, '#fde047'); });
    def('flower', ({ fill, speck, p, r }) => { fill('#6cbf4a'); speck(['#79c955', '#5eae40', '#86d15f'], .3); for (let i = 0; i < 4; i++) { const x = 2 + Math.floor(r() * 12), y = 2 + Math.floor(r() * 12), c = pick(r, ['#ff7aa8', '#ffd84d', '#ffffff', '#b98cff']); p(x, y - 1, c); p(x - 1, y, c); p(x + 1, y, c); p(x, y + 1, c); p(x, y, '#f7b733'); } });
    def('bench', ({ fill, rect }) => { fill('#5a3a20'); for (let y = 0; y < 16; y += 4) { rect(0, y, 16, 3, '#b07a47'); rect(0, y, 16, 1, '#c99463'); } });
    def('pole', ({ fill, rect, p, r }) => { fill('#9a6a3e'); rect(0, 0, 3, 16, '#b8845a'); rect(12, 0, 4, 16, '#7a5230'); for (let i = 0; i < 6; i++) p(4 + Math.floor(r() * 7), Math.floor(r() * 16), '#855a33'); });
    def('poleBlue', ({ fill, rect }) => { fill('#2f7fd6'); rect(0, 0, 3, 16, '#63a8f0'); rect(12, 0, 4, 16, '#1f5fa8'); for (let y = 3; y < 16; y += 6) rect(0, y, 16, 1, '#1a4f8c'); });
    def('glassWall', ({ fill, rect, p }) => { fill('#56606e'); rect(1, 0, 14, 16, '#7fc0e0'); rect(1, 0, 14, 6, '#a3d6ee'); rect(0, 0, 1, 16, '#3f4752'); rect(15, 0, 1, 16, '#3f4752'); rect(1, 15, 14, 1, '#3f4752'); p(3, 2, '#f0faff'); p(4, 2, '#f0faff'); p(3, 3, '#f0faff'); });
    // 놀이동 외벽: 흰 패널 + 초록 띠 (조감도)
    def('panelWall', ({ fill, rect, speck }) => { fill('#f7f7f2'); speck(['#efefe8', '#fcfcf8'], .25); rect(15, 0, 1, 16, '#e0e0d8'); rect(0, 11, 16, 5, '#3f9f55'); rect(0, 11, 16, 1, '#6cc27f'); rect(0, 15, 16, 1, '#2d7a40'); });
    def('panelTop', ({ fill, speck, rect }) => { fill('#f7f7f2'); speck(['#efefe8', '#fcfcf8'], .25); rect(15, 0, 1, 16, '#e0e0d8'); });
    def('panelWin', ({ fill, rect, p }) => { fill('#f7f7f2'); rect(1, 2, 14, 11, '#3f4752'); rect(2, 3, 12, 9, '#7fc0e0'); rect(2, 3, 12, 3, '#a3d6ee'); rect(7, 3, 1, 9, '#3f4752'); p(3, 4, '#f0faff'); p(4, 4, '#f0faff'); rect(0, 14, 16, 2, '#e0e0d8'); });
    def('panelBand', ({ fill, rect }) => { fill('#3f9f55'); rect(0, 0, 16, 2, '#6cc27f'); rect(0, 14, 16, 2, '#2d7a40'); });
    // 벽화 지붕 물감 (금속 지붕 이음새 + 붓자국)
    const paint = (name, color, seams = true) => def(name, ({ fill, speck, rect }) => { fill(color); speck([shade(color, 1.06), shade(color, .95)], .22); if (seams) { rect(0, 0, 1, 16, shade(color, .88)); rect(8, 0, 1, 16, shade(color, .92)); } });
    paint('skyD', '#4aa3e6'); paint('skyM', '#7cc4f1'); paint('skyL', '#b3e2f8'); paint('cloud', '#ffffff');
    ['#ef4444', '#f97316', '#facc15', '#22c55e', '#3b82f6', '#8b5cf6'].forEach((c, i) => paint('rb' + i, c));
    paint('treeP', '#2e8b57'); paint('roofDk', '#4b5563'); paint('pink', '#f472b6', false);
    ['carR:#e11d48', 'carB:#2563eb', 'carW:#f1f5f9', 'carS:#94a3b8', 'carY:#facc15'].forEach(s => { const [n, c] = s.split(':'); paint(n, c, false); });
    def('carGlass', ({ fill, rect }) => { fill('#334155'); rect(1, 1, 14, 6, '#64748b'); rect(2, 2, 4, 2, '#cbd5e1'); });
    // 탄성 바닥 (EPDM)
    const rubber = (name, c) => def(name, ({ fill, speck }) => { fill(c); speck([shade(c, 1.08), shade(c, .92)], .3); speck(['#ffffff', '#fde047', '#1f2937'], .04); });
    rubber('rubP', '#a855f7'); rubber('rubB', '#3b82f6'); rubber('rubC', '#22d3ee'); rubber('rubM', '#ec4899'); rubber('rubR', '#d9564a');
    // 실내: 퍼즐 매트 · 쿠션 · 흰 프레임 · 사물함
    const foam = (name, c) => def(name, ({ fill, speck, rect, p }) => { fill(c); speck([shade(c, 1.03), shade(c, .97)], .2); rect(6, 0, 4, 1, shade(c, .8)); rect(6, 15, 4, 1, shade(c, .8)); rect(0, 6, 1, 4, shade(c, .8)); rect(15, 6, 1, 4, shade(c, .8)); p(7, 1, shade(c, .85)); p(8, 1, shade(c, .85)); });
    foam('foamL', '#eceef1'); foam('foamD', '#aab1bc');
    const pad = (name, c) => def(name, ({ fill, rect, p }) => { fill(c); rect(0, 0, 16, 1, shade(c, 1.2)); rect(0, 15, 16, 1, shade(c, .75)); rect(15, 0, 1, 16, shade(c, .8)); for (let x = 2; x < 15; x += 3) p(x, 2, shade(c, .85)); for (let x = 2; x < 15; x += 3) p(x, 13, shade(c, .85)); rect(2, 7, 12, 1, shade(c, .9)); });
    pad('padG', '#4cae4f'); pad('padO', '#f28c28'); pad('padB', '#3b82f6'); pad('padY', '#facc15'); pad('padR', '#ef4444');
    def('wframe', ({ fill, rect }) => { fill('#f3f4f6'); rect(0, 0, 3, 16, '#ffffff'); rect(12, 0, 4, 16, '#d1d5db'); rect(0, 7, 16, 1, '#e5e7eb'); });
    def('locker', ({ fill, rect, p }) => { fill('#2f7fd6'); rect(0, 0, 16, 1, '#63a8f0'); rect(7, 0, 2, 16, '#1f5fa8'); for (let y = 3; y < 7; y += 2) { rect(2, y, 4, 1, '#1a4f8c'); rect(10, y, 4, 1, '#1a4f8c'); } p(5, 10, '#e5e7eb'); p(10, 10, '#e5e7eb'); });
    def('whiteWall', ({ fill, speck, rect }) => { fill('#f4f6f8'); speck(['#eef1f4', '#fafbfc'], .2); rect(0, 15, 16, 1, '#dde2e8'); });

        '.....HHHHHH.....',
        '...TTTTTTTTTT...',
        '..STTTTTTTTTTS..',
        '..STTTTTTTTTTS..',
        '...UUUUUUUUUU...',
        '....PPP..PPP....',
        '....PPP..PPP....',
        '....PPP..PPP....',
        '....OOO..OOO....'
      ],
      side: [
        '................',
        '.....CCCCCC.....',
        '....CCCCCCCCD...',
        '....HCCCCCCDD...',
        '....HSSSSSSS....',
        '....HSSSSESS....',
        '....HSSSSSSS....',
        '.....SSSSSS.....',
        '....TTTTTTTT....',
        '....TTTTTTTTS...',
        '....TTTTTTTTS...',
        '....UUUUUUUU....',
        '.....PPPPPP.....',
        '.....PPPPPP.....',
        '.....PPPPPP.....',
        '.....OOOOO......'
      ]
    };
    // 두 번째 걸음(다리 벌림) — 해당 행만 갈아끼움
    const SPRITE_STEP = {
      down: { 13: '...PPP....PPP...', 14: '...PPP....PPP...', 15: '...OOO....OOO...' },
      up: { 13: '...PPP....PPP...', 14: '...PPP....PPP...', 15: '...OOO....OOO...' },
      side: { 12: '....PPPPPP......', 13: '...PPP..PPP.....', 14: '..PPP....PPP....', 15: '..OOO.....OOO...' }
    };
    const FRAME_ORDER = ['down', 'down', 'up', 'up', 'side', 'side'];   // 0,1 앞 / 2,3 뒤 / 4,5 옆
    const DIR_BASE = { down: 0, up: 2, side: 4 };
    const FRAMES = FRAME_ORDER.length;

    function personTexture(sp) {
      const cap = sp.cap || sp.hair;
      const dark = (hex, f = 0.62) => { const n = parseInt(hex.slice(1), 16); const v = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(c => Math.round(c * f)); return '#' + v.map(c => c.toString(16).padStart(2, '0')).join(''); };
      const COLORS = { C: cap, D: dark(cap), H: sp.hair, S: sp.skin, E: '#1b1f2a', T: sp.shirt, U: dark(sp.shirt, 0.72), P: sp.pants, O: '#151a24' };
      const c = document.createElement('canvas'); c.width = 16 * FRAMES; c.height = 16;
      const g = c.getContext('2d');

      FRAME_ORDER.forEach((dir, i) => {
        const rows = SPRITE[dir].slice();
        if (i % 2 === 1) Object.entries(SPRITE_STEP[dir]).forEach(([y, row]) => { rows[Number(y)] = row; });
        const ox = i * 16;
        rows.forEach((row, y) => {
          for (let x = 0; x < 16; x++) {
            const ch = row[x]; if (!ch || ch === '.') continue;
            g.fillStyle = COLORS[ch] || '#ffffff'; g.fillRect(ox + x, y, 1, 1);
          }
        });
      });

      // 1px 외곽선 (배경에서 또렷하게 — 프레임 경계는 넘지 않음)
      const W = c.width, img = g.getImageData(0, 0, W, 16), d = img.data, out = new Uint8ClampedArray(d);
      for (let y = 0; y < 16; y++) for (let x = 0; x < W; x++) {
        const i = (y * W + x) * 4; if (d[i + 3]) continue;
        const touch = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => {
          const xx = x + dx, yy = y + dy;
          return xx >= 0 && yy >= 0 && xx < W && yy < 16 && ((xx / 16) | 0) === ((x / 16) | 0) && d[(yy * W + xx) * 4 + 3];
        });
        if (touch) { out[i] = 16; out[i + 1] = 20; out[i + 2] = 28; out[i + 3] = 255; }
      }
      g.putImageData(new ImageData(out, W, 16), 0, 0);

      const t = new THREE.CanvasTexture(c);
      t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; t.colorSpace = THREE.SRGBColorSpace;
      t.repeat.set(1 / FRAMES, 1);
      return t;
    }
    const LOOKS = [
      { skin: '#f6cba4', hair: '#3b2a20', shirt: '#e2574c', pants: '#374a7a', cap: '#e11d48' },
      { skin: '#f6cba4', hair: '#1f2430', shirt: '#f2c14e', pants: '#3b82f6', kid: true },
      { skin: '#ecbb92', hair: '#6b4226', shirt: '#22c55e', pants: '#1f2937', kid: true, cap: '#facc15' },
      { skin: '#f6cba4', hair: '#2a1f18', shirt: '#8b5cf6', pants: '#4b5563' },
      { skin: '#f0c39a', hair: '#c68642', shirt: '#0ea5e9', pants: '#334155', cap: '#0284c7' },
      { skin: '#ecbb92', hair: '#1f2430', shirt: '#f97316', pants: '#1e3a8a', kid: true },
      { skin: '#f6cba4', hair: '#3b2a20', shirt: '#ec4899', pants: '#374151', kid: true, cap: '#f472b6' },
      { skin: '#f0c39a', hair: '#6b4226', shirt: '#14b8a6', pants: '#1f2937', kid: true },
      { skin: '#ecbb92', hair: '#1f2430', shirt: '#facc15', pants: '#7c3aed', kid: true, cap: '#a855f7' },
      { skin: '#f6cba4', hair: '#2a1f18', shirt: '#ffffff', pants: '#1d4ed8' }
    ];
    function makePerson(sp) {
      const tex = personTexture(sp), geo = new THREE.PlaneGeometry(1, 1); geo.translate(0, 0.5, 0);
      const mesh = new THREE.Mesh(geo, withCurve(new THREE.MeshLambertMaterial({ map: tex, alphaTest: 0.5, side: THREE.DoubleSide })));
      mesh.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: tex, alphaTest: 0.5 });
      mesh.castShadow = true;
      const s = sp.kid ? 1.35 : 1.75;
      mesh.scale.set(s, s, 1); mesh.rotation.order = 'YXZ';
      return { mesh, tex, size: s, dir: 'down', flip: 1 };
    }
    /* 카메라를 향해 세우고(발이 축), 이동 방향에 맞는 앞·뒤·옆 그림을 고른다.
       카메라가 돌아가도 "화면 기준"으로 판단하므로 어느 각도에서나 자연스럽다. */
    const faceCamera = (p, moveX, moveZ, sph, camFwd, camRight, now, moving) => {
      p.mesh.rotation.set(-(Math.PI / 2 - sph.phi), sph.theta, 0);
      if (moving) {
        const away = moveX * camFwd.x + moveZ * camFwd.z;     // + : 카메라에서 멀어짐 → 뒤통수
        const side = moveX * camRight.x + moveZ * camRight.z; // + : 화면 오른쪽
        if (Math.abs(away) >= Math.abs(side)) p.dir = away > 0 ? 'up' : 'down';
        else { p.dir = 'side'; p.flip = side < 0 ? -1 : 1; }
      }
      p.mesh.scale.x = p.size * (p.dir === 'side' ? p.flip : 1);
      const step = moving ? (Math.floor(now * 6) % 2) : 0;
      p.tex.offset.x = (DIR_BASE[p.dir] + step) / FRAMES;
    };

    /* ================= 9. 조명·후처리 ================= */
    const hemi = new THREE.HemisphereLight('#d8ecff', '#6f8f52', 1.15), sun = new THREE.DirectionalLight('#fff4de', 2.5);
    sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 260 });
    sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03; scene.add(hemi, sun, sun.target);
    const TIMES = {
      day: { sky: '#bfe3ff', fog: '#cfe9ff', sun: '#fff4de', si: 2.5, hs: '#d8ecff', hg: '#6f8f52', hi: 1.15, dir: [0.55, 0.72, 0.42] },
      dusk: { sky: '#f7c9a3', fog: '#f3cfae', sun: '#ffb27a', si: 2.2, hs: '#ffd9b8', hg: '#6b5a4a', hi: 0.95, dir: [0.8, 0.32, 0.5] }
    };
    let timeKey = 'day';
    function applyLight(t) {
      scene.background = new THREE.Color(t.sky); scene.fog = t.fog ? new THREE.Fog(t.fog, 220, 520) : null;
      sun.color.set(t.sun); sun.intensity = t.si; hemi.color.set(t.hs); hemi.groundColor.set(t.hg); hemi.intensity = t.hi;
      sun.userData.dir = new THREE.Vector3(...t.dir).normalize();
    }
    const TiltShader = {
      uniforms: { tDiffuse: { value: null }, uRes: { value: new THREE.Vector2(1, 1) }, uDir: { value: new THREE.Vector2(1, 0) }, uBand: { value: .14 }, uRamp: { value: .3 }, uSpread: { value: 0 }, uSat: { value: 0 } },
      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 uRes; uniform vec2 uDir; uniform float uBand, uRamp, uSpread, uSat; varying vec2 vUv;
        void main(){ float f = smoothstep(uBand, uBand + uRamp, abs(vUv.y - 0.5)); vec2 o = uDir * f * uSpread / uRes;
          vec4 c = texture2D(tDiffuse, vUv) * 0.2270270;
          c += (texture2D(tDiffuse, vUv + o * 1.3846154) + texture2D(tDiffuse, vUv - o * 1.3846154)) * 0.3162162;
          c += (texture2D(tDiffuse, vUv + o * 3.2307692) + texture2D(tDiffuse, vUv - o * 3.2307692)) * 0.0702703;
          if (uSat > 0.0) { float l = dot(c.rgb, vec3(0.2126, 0.7152, 0.0722)); c.rgb = mix(vec3(l), c.rgb, 1.0 + uSat); }
          gl_FragColor = c; }`
    };
    const composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera));
    const tiltH = new ShaderPass(TiltShader), tiltV = new ShaderPass(TiltShader); tiltV.uniforms.uDir.value.set(0, 1);
    composer.addPass(tiltH); composer.addPass(tiltV); composer.addPass(new OutputPass());
    const TILT = [null, { band: .16, ramp: .32, spread: 2.4 }, { band: .10, ramp: .3, spread: 4 }];
    function setTilt(l) { const t = TILT[l]; [tiltH, tiltV].forEach(p => { p.enabled = !!t; if (t) Object.assign(p.uniforms.uBand, { value: t.band }), Object.assign(p.uniforms.uRamp, { value: t.ramp }), Object.assign(p.uniforms.uSpread, { value: t.spread }); }); tiltV.uniforms.uSat.value = t ? .18 : 0; }
    setTilt(1);
    let aaScale = 1;
    function resize() {
      const w = innerWidth, h = innerHeight, pr = Math.min(devicePixelRatio || 1, 2) * aaScale;
      renderer.setPixelRatio(pr); renderer.setSize(w, h); composer.setPixelRatio(pr); composer.setSize(w, h);
      camera.aspect = w / h; camera.updateProjectionMatrix(); [tiltH, tiltV].forEach(p => p.uniforms.uRes.value.set(w * pr, h * pr));
    }
    addEventListener('resize', resize);
    function setPitch(deg) {
      const off = camera.position.clone().sub(controls.target), sph = new THREE.Spherical().setFromVector3(off);
      sph.phi = THREE.MathUtils.clamp(THREE.MathUtils.degToRad(90 - deg), controls.minPolarAngle, controls.maxPolarAngle);
      camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(sph));
    }

    /* ================= 10. 맵 전환·플레이어 ================= */
    const MAPS = { outdoor: buildOutdoor(), hall: buildHall() };
    Object.values(MAPS).forEach(mp => {
      mp.npcs = mp.npcRoutes.map((nr, i) => { const p = makePerson(LOOKS[nr.look % LOOKS.length]); mp.group.add(p.mesh); return { ...p, route: nr.route, y: nr.y, seg: 0, t: 0, phase: i * .37 }; });
    });
    const player = makePerson({ skin: '#f3c9a0', hair: '#2a1f18', shirt: '#2563eb', pants: '#1f2937', cap: '#e11d48', kid: false });
    player.pos = new THREE.Vector3(); player.y = 2; player.drawY = 2;
    let cur = null;
    const labelsBox = document.getElementById('labels'); let labelEls = [], showLabels = true;
    const meLabel = document.createElement('div'); meLabel.className = 'label me'; meLabel.textContent = '나';

    function enterMap(key, at) {
      if (cur) scene.remove(cur.group);
      cur = MAPS[key]; scene.add(cur.group); cur.group.add(player.mesh);
      const s = at || cur.spawn; player.pos.set(s.x, 0, s.z); player.y = cur.standY(s.x, s.z, cur.H - 3) ?? cur.G; player.drawY = player.y;
      applyLight(cur.light || TIMES[timeKey]);
      document.getElementById('placeName').textContent = cur.name;
      labelsBox.innerHTML = ''; labelEls = cur.labels.map(([text, x, y, z, cls]) => { const el = document.createElement('div'); el.className = 'label' + (cls ? ' ' + cls : ''); el.textContent = text; labelsBox.appendChild(el); return { el, p: new THREE.Vector3(x, y, z) }; });
      labelsBox.appendChild(meLabel);
      controls.target.set(player.pos.x, player.y + 0.8, player.pos.z);
      const dist = key === 'hall' ? 34 : 58;
      camera.position.copy(controls.target).add(new THREE.Vector3(0, 0, dist)); setPitch(key === 'hall' ? 55 : 50);
      document.querySelectorAll('#gPitch button').forEach(b => b.classList.toggle('on', Number(b.dataset.v) === (key === 'hall' ? 50 : 50)));
      controls.update();
    }
    let switching = false;
    function travel(door) {
      if (switching) return; switching = true;
      const fade = document.getElementById('fade'); fade.style.opacity = 1;
      setTimeout(() => {
        if (door.to === 'hall') enterMap('hall');
        else enterMap('outdoor', MAPS.outdoor.hallExit);
        toast(door.to === 'hall' ? '놀이동 실내에 들어왔어요 · 소프트플레이 계단으로 2·3층에 올라가 보세요' : '야외로 나왔어요');
        fade.style.opacity = 0; setTimeout(() => { switching = false; }, 400);
      }, 300);
    }
    function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(t._h); t._h = setTimeout(() => { t.style.opacity = 0; }, 2600); }

    /* ---- 입력: 키보드 + 조이스틱 ---- */
    const keys = new Set();
    addEventListener('keydown', e => { if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault(); keys.add(e.key.toLowerCase()); });
    addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
    const joy = document.getElementById('joy'), knob = joy.querySelector('i'); const joyV = { x: 0, y: 0 };
    if (matchMedia('(pointer: coarse)').matches) joy.style.display = 'block';
    let joyId = null;
    const joyMove = (e) => { const r = joy.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2; let dx = e.clientX - cx, dy = e.clientY - cy; const L = Math.hypot(dx, dy), max = r.width / 2 - 20; if (L > max) { dx *= max / L; dy *= max / L; } knob.style.transform = `translate(${dx}px, ${dy}px)`; joyV.x = dx / max; joyV.y = dy / max; };
    joy.addEventListener('pointerdown', e => { joyId = e.pointerId; joy.setPointerCapture(joyId); joyMove(e); });
    joy.addEventListener('pointermove', e => { if (e.pointerId === joyId) joyMove(e); });
    const joyEnd = e => { if (e.pointerId !== joyId) return; joyId = null; joyV.x = joyV.y = 0; knob.style.transform = ''; };
    joy.addEventListener('pointerup', joyEnd); joy.addEventListener('pointercancel', joyEnd);

    function tryMove(nx, nz) {
      // 몸 반지름만큼 앞쪽도 확인 (벽에 파묻히지 않게)
      const y = cur.standY(nx, nz, player.y);
      if (y === null || y - player.y > 1.01) return false;
      player.pos.x = nx; player.pos.z = nz; player.y = y; return true;
    }

    /* ================= 11. 루프 ================= */
    const clock = new THREE.Clock();
    let simTime = 0;
    function frame(stepDt) {
      const dt = stepDt ?? Math.min(clock.getDelta(), 0.05); simTime += dt; const now = simTime;
      // 이동 방향 (카메라 기준)
      let ix = 0, iz = 0;
      if (keys.has('w') || keys.has('arrowup')) iz -= 1; if (keys.has('s') || keys.has('arrowdown')) iz += 1;
      if (keys.has('a') || keys.has('arrowleft')) ix -= 1; if (keys.has('d') || keys.has('arrowright')) ix += 1;
      ix += joyV.x; iz += joyV.y;
      const fwd = controls.target.clone().sub(camera.position); fwd.y = 0; fwd.normalize();
      const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0));
      let mx = right.x * ix - fwd.x * iz, mz = right.z * ix - fwd.z * iz; const ml = Math.hypot(mx, mz);
      const moving = ml > 0.1 && !switching;
      if (moving) {
        mx /= Math.max(1, ml); mz /= Math.max(1, ml);
        const sp = (cur === MAPS.hall ? 4.2 : 6.0) * dt, pr = 0.3;
        const px = player.pos.x, pz = player.pos.z;
        const okX = cur.standY(px + mx * sp + Math.sign(mx) * pr, pz, player.y); if (okX !== null && okX - player.y <= 1.01) tryMove(px + mx * sp, pz);
        const okZ = cur.standY(player.pos.x, pz + mz * sp + Math.sign(mz) * pr, player.y); if (okZ !== null && okZ - player.y <= 1.01) tryMove(player.pos.x, pz + mz * sp);
        for (const d of cur.doors) if (player.pos.x >= d.x0 && player.pos.x < d.x1 && player.pos.z >= d.z0 && player.pos.z < d.z1) travel(d);
      }
      player.drawY += (player.y - player.drawY) * Math.min(1, dt * 14);
      let bounce = 0; for (const b of cur.bouncers) if (Math.hypot(player.pos.x - b.x, player.pos.z - b.z) < b.r) bounce = Math.abs(Math.sin(now * 6.5)) * 1.3;
      player.mesh.position.set(player.pos.x, player.drawY + 0.02 + bounce + (bounce ? 0.18 : 0), player.pos.z);
      // 카메라가 플레이어를 부드럽게 따라감
      const want = new THREE.Vector3(player.pos.x, player.drawY + 0.8, player.pos.z), delta = want.sub(controls.target).multiplyScalar(Math.min(1, dt * 6));
      controls.target.add(delta); camera.position.add(delta);
      controls.update();
      sun.target.position.copy(controls.target); sun.position.copy(controls.target).addScaledVector(sun.userData.dir, 120);
      const dist = camera.position.distanceTo(controls.target), vh = 2 * dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      curveU.value = cur === MAPS.hall ? 0 : 0.045 / vh; focusU.value.set(controls.target.x, controls.target.z);
      cur.updaters.forEach(fn => fn(dt, now));
      const sph = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target)), camRight = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
      faceCamera(player, mx, mz, sph, fwd, camRight, now, moving);
      cur.npcs.forEach(n => {
        const a = n.route[n.seg], b = n.route[(n.seg + 1) % n.route.length], len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
        n.t += dt * 1.3 / len; if (n.t >= 1) { n.t = 0; n.seg = (n.seg + 1) % n.route.length; }
        const x = a[0] + (b[0] - a[0]) * n.t + .5, z = a[1] + (b[1] - a[1]) * n.t + .5, y = cur.standY(x, z, n.y) ?? n.y; n.y = y;
        let nb = 0; for (const bb of cur.bouncers) if (Math.hypot(x - bb.x, z - bb.z) < bb.r) nb = Math.abs(Math.sin(now * 6 + n.phase * 9)) * 1.1;
        n.mesh.position.set(x, y + .02 + nb, z); faceCamera(n, b[0] - a[0], b[1] - a[1], sph, fwd, camRight, now + n.phase, true);
      });
      composer.render();
      // 이름표
      const w = innerWidth, h = innerHeight;
      const place = (el, p) => { const v = p.clone().project(camera), vis = showLabels && v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1; el.style.display = vis ? 'block' : 'none'; if (vis) el.style.transform = `translate(${(v.x * .5 + .5) * w}px, ${(-v.y * .5 + .5) * h}px) translate(-50%, -100%)`; };
      labelEls.forEach(({ el, p }) => place(el, p));
      place(meLabel, new THREE.Vector3(player.pos.x, player.drawY + player.size + 0.4 + bounce, player.pos.z));
    }
    function tick() { frame(); requestAnimationFrame(tick); }

    /* ================= 12. 버튼 ================= */
    const bind = (id, fn) => document.querySelectorAll(`#${id} button`).forEach(b => b.addEventListener('click', () => { if (id !== 'gMisc') document.querySelectorAll(`#${id} button`).forEach(x => x.classList.toggle('on', x === b)); fn(b.dataset.v, b); b.blur(); }));
    bind('gPitch', v => setPitch(Number(v)));
    bind('gTilt', v => setTilt(Number(v)));
    bind('gTime', v => { timeKey = v; if (!cur.light) applyLight(TIMES[v]); });
    bind('gMisc', (v, b) => { b.classList.toggle('on'); const on = b.classList.contains('on'); if (v === 'labels') showLabels = on; if (v === 'aa') { aaScale = on ? 1.6 : 1; resize(); } });

    resize();
    enterMap('outdoor');
    document.getElementById('loading').remove();
    toast('놀이동 초록 입구 ▶ 로 걸어가면 실내로 들어가요');
    window.__bongtteurak = { camera, controls, scene, MAPS, player, enterMap, get cur() { return cur; }, teleport(x, z) { player.pos.set(x, 0, z); player.y = cur.standY(x, z, cur.H - 3) ?? cur.G; player.drawY = player.y; },
      step(n = 1, dt = 1 / 30) { for (let i = 0; i < n; i++) frame(dt); } };
    tick();
  </script>
</body>
</html>
