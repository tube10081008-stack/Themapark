<!DOCTYPE html>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Lucide Icons -->

  <script>

      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {

              100: '#dcfce7',
              300: '#86efac',
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
              950: '#052e16'

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .animate-fadeIn { animation: fadeIn .25s ease-out; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased select-none">

  <!-- ================================================================= -->
  <!-- HEADER (고객 노출 화면 — 직원용 페이지 이동 버튼 없음)               -->
  <!--   · 로고를 2초간 길게 누르면 직원용 메인 메뉴로 이동                 -->

  <header class="bg-slate-950/90 border-b border-slate-800/80 sticky top-0 z-40 backdrop-blur-md px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <div id="staffExitLogo" class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center shadow-md shadow-brand-600/30 shrink-0" title="">
        <i data-lucide="trees" class="w-5 h-5 text-white"></i>
      </div>
      <div class="min-w-0">
        <h1 class="text-base sm:text-lg font-black tracking-tight text-white truncate" data-site="facility.name">리틀포레스트 봉플레이</h1>
        <p class="text-xs text-slate-400">입장 · 퇴장 게이트</p>
      </div>
    </div>

    <div class="flex items-center gap-3 shrink-0">
      <div class="text-right hidden sm:block">
        <div id="gateClock" class="text-xl font-black font-mono text-white leading-none">--:--</div>
        <div id="gateDate" class="text-[11px] text-slate-500 mt-1">-</div>
      </div>
      <div id="syncStatusBadge" class="scale-90 origin-right opacity-70"></div>
      <button onclick="toggleFullScreen()" class="p-2 bg-slate-900 hover:bg-slate-800 text-slate-400 rounded-xl border border-slate-800 transition" title="전체화면">
        <i data-lucide="maximize" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- ================================================================= -->
  <!-- MAIN                                                              -->
  <!-- ================================================================= -->
  <main class="flex-1 p-3 sm:p-6 overflow-y-auto max-w-5xl mx-auto w-full space-y-4">

    <!-- 1. 스캔 안내 (고객용 대기 화면) -->
    <section class="rounded-3xl border border-brand-800/40 bg-gradient-to-br from-brand-950 via-slate-900 to-slate-900 p-5 sm:p-7">
      <div class="flex flex-col md:flex-row md:items-center gap-5">
        <div class="flex-1 space-y-3">
          <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-brand-900/70 text-brand-300 text-xs font-bold">
            <i data-lucide="scan-line" class="w-3.5 h-3.5"></i>
            입장할 때 · 나갈 때 모두
          </span>
          <h2 class="text-2xl sm:text-3xl font-black text-white leading-snug">
            휴대폰의 <span class="text-brand-400">입장 QR</span>을<br>카메라에 비춰 주세요
          </h2>
          <p class="text-sm text-slate-300 leading-relaxed">
            QR이 없으면 서약 번호(BP-로 시작)나 휴대폰 뒷번호 4자리를 입력하셔도 됩니다.
          </p>

          <form onsubmit="handleManualSearch(event)" class="flex gap-2 pt-1">
            <input type="text" id="scannerInput" autocomplete="off" placeholder="서약 번호 또는 휴대폰 뒷번호"
              class="flex-1 min-w-0 bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3.5 text-base text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 font-mono tracking-wider">
            <button type="submit" class="px-5 py-3.5 bg-brand-600 hover:bg-brand-500 active:scale-[0.98] text-white font-black text-sm rounded-2xl shadow transition shrink-0">
              확인
            </button>
          </form>
        </div>

        <!-- 카메라 미리보기 -->
        <div class="md:w-80 shrink-0 space-y-2">
          <div id="cameraPreviewContainer" class="hidden relative bg-black rounded-3xl overflow-hidden aspect-square border-2 border-brand-600/60">
            <video id="cameraVideo" class="w-full h-full object-cover" autoplay playsinline muted></video>
            <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
              <div class="w-3/5 aspect-square rounded-3xl border-4 border-white/80 shadow-[0_0_0_9999px_rgba(0,0,0,0.35)]"></div>
            </div>
            <canvas id="scanCanvas" class="hidden"></canvas>
          </div>
          <button type="button" id="btnToggleCamera" onclick="toggleCameraScanner()"
            class="w-full py-3 bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-bold text-sm rounded-2xl flex items-center justify-center gap-2 transition">
            <i data-lucide="camera" class="w-4 h-4"></i>
            <span id="cameraBtnText">카메라 켜기</span>
          </button>
        </div>
      </div>
    </section>

    <!-- 2. 스캔 결과 (다음 스캔 전까지 유지) -->
    <div id="scanResultPanel" class="hidden bg-slate-900 border border-slate-800 rounded-3xl p-5 sm:p-6 shadow-2xl space-y-4 animate-fadeIn">
      <!-- Injected via renderScanResult() -->
    </div>

    <!-- 3. 지금 원내 현황 (고객에게도 유용한 혼잡도) -->
    <section class="bg-slate-900/90 border border-slate-800 rounded-3xl p-4 sm:p-5">
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-sky-500/15 text-sky-400 flex items-center justify-center">
            <i data-lucide="users" class="w-5 h-5"></i>
          </div>
          <div>
            <div class="text-sm font-black text-white">지금 원내</div>
            <div class="text-xs text-slate-400">정원 <span id="capMaxText">-</span>명</div>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div class="text-right">
            <span id="currentInsideCount" class="text-3xl font-black font-mono text-sky-400">0</span>
            <span class="text-sm font-bold text-slate-400">명</span>
          </div>
          <span id="capacityStatusPill" class="px-2.5 py-1 rounded-full text-xs font-extrabold bg-emerald-950 text-emerald-300 border border-emerald-800">쾌적</span>
        </div>
      </div>
      <div class="w-full bg-slate-950 h-2.5 rounded-full overflow-hidden border border-slate-800 mt-3">
        <div id="occupancyProgressBar" class="h-full bg-gradient-to-r from-emerald-500 via-sky-500 to-amber-500 transition-all duration-500 rounded-full" style="width: 0%;"></div>
      </div>
      <div class="mt-2 flex items-center justify-between text-[11px] text-slate-500">
        <span>수용률 <span id="occupancyRateText" class="font-bold text-slate-300">0%</span></span>
        <span class="hidden sm:inline">쾌적 <span id="capComfortText">-</span>명 · 주의 <span id="capCautionText">-</span>명 · 정원 <span id="capMaxText2">-</span>명</span>
      </div>
    </section>

    <!-- 4. 직원용: 오늘 집계 + 출입 로그 (기본 접힘, 이름·번호 가림) -->
    <details class="bg-slate-900/60 border border-slate-800 rounded-3xl p-4 sm:p-5 group">
      <summary class="cursor-pointer list-none flex items-center justify-between text-sm font-bold text-slate-400">
        <span class="flex items-center gap-2"><i data-lucide="lock" class="w-4 h-4"></i> 직원용 · 오늘 출입 기록</span>
        <span class="text-xs text-slate-500">입장 <b id="cumEntryCount" class="text-emerald-400 font-mono">0</b> · 퇴장 <b id="cumExitCount" class="text-purple-400 font-mono">0</b>명
          <i data-lucide="chevron-down" class="w-4 h-4 inline group-open:rotate-180 transition"></i></span>
      </summary>
      <div class="overflow-x-auto mt-3">
        <table class="w-full text-left text-xs">
          <thead class="text-slate-500 border-b border-slate-800/80 text-[11px]">
            <tr>
              <th class="py-2 px-3">시각</th>
              <th class="py-2 px-3">구분</th>
              <th class="py-2 px-3">서약 번호</th>
              <th class="py-2 px-3">보호자</th>
              <th class="py-2 px-3">인원</th>
              <th class="py-2 px-3">상태</th>
            </tr>
          </thead>
          <tbody id="activityLogBody" class="divide-y divide-slate-800/60 font-mono">
            <tr><td colspan="6" class="py-8 text-center text-slate-500 font-sans">스캔 대기 중입니다.</td></tr>
          </tbody>
        </table>
      </div>
    </details>
  </main>

  <!-- 태블릿 정성 설문 모달 -->
  <div id="fullSurveyModal" class="hidden fixed inset-0 z-50 bg-slate-950 flex flex-col">
    <iframe id="fullSurveyFrame" title="방문 후기 설문" class="flex-1 w-full border-0 bg-slate-950" src="about:blank"></iframe>
  </div>

  <!-- ================================================================= -->
  <!-- AUDIO SYNTHESIZER & SCRIPT LOGIC                                  -->
  <!-- ================================================================= -->
  <script>
    let consents = [];
    let recentLogs = [];
    let cameraStream = null;

    // Web Audio Chime Generator
    function playChime(type) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'entry') {
          // Cheerful High 2-tone Chime
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
          osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.12); // A5
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'exit') {
          // Gentle Mid 2-tone Chime
          osc.type = 'sine';
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime); // E5
          osc.frequency.setValueAtTime(440, audioCtx.currentTime + 0.12); // A4
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
        } else {
          // Warning Low Buzz
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        }
      } catch (e) {}
    }

    // 1. Initial Load
    document.addEventListener('DOMContentLoaded', async function () {
      lucide.createIcons();
      BongplaySync.renderBadge('syncStatusBadge');

      BongplaySync.onDataChange(function () {
        loadData();
      });

      await loadData();
      setupScannerKeyboardListener();
      startGateClock();
      setupStaffExit();
      // 직원이 한 번 켜 둔 카메라는 새로고침·재부팅 후에도 자동으로 다시 켠다 (고객 셀프 스캔용)
      try { if (localStorage.getItem('bongplay_gate_camera_on') === '1') toggleCameraScanner(); } catch (e) {}

      // Check URL param ?pass=...
      try {
        const params = new URLSearchParams(window.location.search);
        const pass = params.get('pass');
        if (pass) {
          processScanCode(pass);
        }
      } catch (e) {}
    });

    // 2. Load Consents & Calculate Occupancy
    async function loadData() {
      try {
        const raw = localStorage.getItem('bongplay_safety_consents');
        if (raw) {
          consents = JSON.parse(raw);
        } else if (window.BongplaySync) {
          const res = await BongplaySync.select('safety_consents', '?select=*&order=updated_at.desc&limit=300');
          if (res.ok && Array.isArray(res.data)) consents = res.data;
        }
      } catch (e) {
        console.warn('Failed to load data:', e);
      }
      recalcOccupancy();
      renderActivityLog();
    }

    function recalcOccupancy() {
      const todayYmd = BongplaySync.toLocalDateStr(new Date());

      // Filter today's records
      const todayRecords = consents.filter(c => {
        const ymd = (c.created_date || c.createdDate || (c.arrival_at || '').slice(0, 10));
        return ymd === todayYmd;
      });

      let insideCount = 0;
      let cumEntry = 0;
      let cumExit = 0;

      todayRecords.forEach(r => {
        const people = ((r.children && r.children.length) || 0) + 1;
        if (r.entry_at) {
          cumEntry += people;
          if (!r.exit_at) {
            insideCount += people;
          }
        }
        if (r.exit_at) {
          cumExit += people;
        }
      });

      // 정원은 기준정보(bongplay-site.js)에서 가져옴 (기준값 정합성 자동 보정)
      const cap = window.BongplaySite ? BongplaySite.capacity() : { max_occupancy: 250, comfortable: 150, caution: 200 };
      const maxCap = Number(cap.max_occupancy) || 250;
      const rate = Math.min(100, Math.round((insideCount / maxCap) * 100));

      // 정원 기준 라벨 표시
      const setTxt = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
      setTxt('capMaxText', maxCap);
      setTxt('capMaxText2', maxCap);
      setTxt('capComfortText', Number(cap.comfortable) || Math.round(maxCap * 0.6));
      setTxt('capCautionText', Number(cap.caution) || Math.round(maxCap * 0.8));

      document.getElementById('currentInsideCount').textContent = insideCount;
      document.getElementById('occupancyRateText').textContent = `${rate}%`;
      document.getElementById('cumEntryCount').textContent = cumEntry;
      document.getElementById('cumExitCount').textContent = cumExit;

      const bar = document.getElementById('occupancyProgressBar');
      bar.style.width = `${rate}%`;

      const pill = document.getElementById('capacityStatusPill');
      if (rate >= 90) {
        pill.textContent = '매우 붐빔';
        pill.className = 'px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-rose-950 text-rose-300 border border-rose-800 animate-pulse';
        bar.className = 'h-full bg-rose-500 transition-all duration-500 rounded-full';
      } else if (rate >= 70) {
        pill.textContent = '붐빔';
        pill.className = 'px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-amber-950 text-amber-300 border border-amber-800';
        bar.className = 'h-full bg-amber-500 transition-all duration-500 rounded-full';
      } else {
        pill.textContent = '쾌적';
        pill.className = 'px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-emerald-950 text-emerald-300 border border-emerald-800';
        bar.className = 'h-full bg-gradient-to-r from-emerald-500 via-sky-500 to-indigo-500 transition-all duration-500 rounded-full';
      }
    }

    // 3. USB Barcode/QR Gun Scanner Listener
    function setupScannerKeyboardListener() {
      let buffer = '';
      let lastKeyTime = Date.now();

      window.addEventListener('keydown', function (e) {
        // If typing directly in scannerInput, let default form submit handle it
        if (document.activeElement && document.activeElement.id === 'scannerInput') {
          return;
        }

        const now = Date.now();
        // Scanner guns typically send characters < 50ms apart
        if (now - lastKeyTime > 150) {
          buffer = '';
        }
        lastKeyTime = now;

        if (e.key === 'Enter') {
          if (buffer.length >= 3) {
            e.preventDefault();
            processScanCode(buffer);
            buffer = '';
          }
        } else if (e.key.length === 1) {
          buffer += e.key;
        }
      });
    }

    function handleManualSearch(e) {
      e.preventDefault();
      const input = document.getElementById('scannerInput');
      const val = input.value.trim();
      if (val) {
        processScanCode(val);
        input.value = '';
      }
    }

    // 4. Process Scanned Code
    function processScanCode(rawCode) {
      let clean = rawCode.trim();
      // Extract pass param if URL scanned
      if (clean.includes('?pass=')) {
        try {
          const u = new URL(clean);
          clean = u.searchParams.get('pass') || clean;
        } catch (e) {}
      }

      const candidates = findConsentCandidates(clean);

      if (candidates.length === 0) {
        playChime('error');
        renderNotFound(clean);
        return;
      }
      if (candidates.length > 1) {
        // 전화번호 뒷자리가 같은 가족이 여럿이면 임의로 고르지 않고 직원이 확인하게 함
        playChime('error');
        renderAmbiguous(clean, candidates);
        return;
      }

      renderScanResult(candidates[0]);
    }

    // 고객이 직접 입력한 값(성명 등)을 직원 화면 innerHTML 에 넣기 전 반드시 이스케이프 (저장형 XSS 방지)
    /* ---- 고객 노출 화면용 개인정보 가림 ---- */
    // 홍길동 → 홍*동, 김철 → 김*, 남궁민수 → 남**수
    function maskName(name) {
      const s = String(name || '').trim();
      if (!s || s === '-' || s === '미입력') return '방문객';
      if (s.length === 1) return s;
      if (s.length === 2) return s[0] + '*';
      return s[0] + '*'.repeat(s.length - 2) + s[s.length - 1];
    }
    // BP-260921-ABCD → BP-··-··CD (직원용 로그에서도 번호 전체를 노출하지 않음)
    function maskPass(pass) {
      const s = String(pass || '');
      return s.length > 4 ? 'BP-··' + s.slice(-2) : s;
    }

    function startGateClock() {
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const tick = () => {
        const d = new Date();
        const c = document.getElementById('gateClock');
        const dt = document.getElementById('gateDate');
        if (c) c.textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        if (dt) dt.textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
      };
      tick();
      setInterval(tick, 15000);
    }

    // 직원 출구: 로고를 2초간 길게 누르면 메인 메뉴로 (고객이 실수로 직원 화면에 들어가지 않도록)
    function setupStaffExit() {
      const logo = document.getElementById('staffExitLogo');
      if (!logo) return;
      let timer = null;
      const start = () => { timer = setTimeout(() => { window.location.href = '../index.html'; }, 2000); };
      const cancel = () => { clearTimeout(timer); timer = null; };
      logo.addEventListener('pointerdown', start);
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => logo.addEventListener(ev, cancel));
      logo.addEventListener('contextmenu', e => e.preventDefault());
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function parseTicketIds(c) {
      let ids = c.ticket_ids || c.ticketIds || [];
      if (typeof ids === 'string') {
        try { ids = JSON.parse(ids); } catch (e) { ids = ids.split(','); }
      }
      return Array.isArray(ids) ? ids.map(x => String(x).trim().toUpperCase()) : [];
    }

    // 매칭 우선순위 (앞 단계에서 찾으면 뒤 단계는 보지 않음)
    //   1) 접수번호(pass_code) 정확 일치  2) 손목 띠지 티켓번호(ticket_ids)
    //   3) 서약서 ID / 방문 ID            4) 전화번호 — 숫자만 4자리 이상 "직접 입력"한 경우만, 당일 접수분 한정
    // 이전 코드는 모든 조건을 OR 로 묶어 find() 로 첫 건을 골랐기 때문에, 접수번호를 스캔해도
    // 그 번호 속 숫자가 다른 가족의 전화번호 뒷자리와 겹치면 엉뚱한 가족이 입장 처리될 수 있었습니다.
    function findConsentCandidates(clean) {
      const target = clean.toUpperCase();

      const byPass = consents.filter(c => {
        const pass = (c.passCode || c.pass_code || '').trim().toUpperCase();
        return !!pass && pass === target;
      });
      if (byPass.length) return byPass;

      const byTicket = consents.filter(c => parseTicketIds(c).includes(target));
      if (byTicket.length) return byTicket;

      const byId = consents.filter(c => (!!c.id && c.id === clean) || (!!c.visit_id && c.visit_id === clean));
      if (byId.length) return byId;

      const isDigitsOnly = /^[0-9\-\s]+$/.test(clean);
      const digits = clean.replace(/[^0-9]/g, '');
      if (isDigitsOnly && digits.length >= 4) {
        const todayYmd = BongplaySync.toLocalDateStr(new Date());
        return consents.filter(c => {
          const ymd = (c.created_date || c.createdDate || (c.arrival_at || '').slice(0, 10));
          const phone = (c.guardianPhone || c.guardian_phone || '').replace(/[^0-9]/g, '');
          return ymd === todayYmd && phone.length >= 4 && phone.endsWith(digits);
        });
      }
      return [];
    }

    function renderAmbiguous(code, list) {
      const panel = document.getElementById('scanResultPanel');
      panel.classList.remove('hidden');
      panel.innerHTML = `
        <div class="bg-amber-950/80 border border-amber-700 rounded-2xl p-4 space-y-3">
          <div class="text-amber-200 font-black text-sm">⚠️ '${escapeHtml(code)}' 에 해당하는 가족이 ${list.length}팀입니다. 손님에게 성함을 확인 후 선택하십시오.</div>
          <div class="space-y-2">
            ${list.map(c => {
              const pass = c.passCode || c.pass_code || '';
              const name = c.guardianName || c.guardian_name || '미입력';
              const kids = (c.children || []).length;
              return `<button type="button" onclick="selectAmbiguousConsent('${escapeHtml(String(c.id).replace(/'/g, ''))}')"
                class="w-full text-left px-3 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700 text-xs text-slate-200">
                <span class="font-mono text-amber-300 font-bold">${escapeHtml(maskPass(pass))}</span> · ${escapeHtml(maskName(name))} 님 · 아이 ${kids}명
              </button>`;
            }).join('')}
          </div>
        </div>`;
    }

    function selectAmbiguousConsent(id) {
      const rec = consents.find(c => String(c.id).replace(/'/g, '') === id);
      if (rec) renderScanResult(rec);
    }

    // 5. Render Scan Result Card
    function renderScanResult(rec, justExited) {
      const panel = document.getElementById('scanResultPanel');
      panel.classList.remove('hidden');

      const passCode = rec.passCode || rec.pass_code || ('BP-' + rec.id.slice(0, 6));
      const guardian = rec.guardianName || rec.guardian_name || '미입력';
      const phone = rec.guardianPhone || rec.guardian_phone || '-';
      const children = rec.children || [];
      const totalPeople = children.length + 1;
      const isIssued = rec.isIssued || rec.is_issued;
      const hasEntered = !!rec.entry_at;
      const hasExited = !!rec.exit_at;

      let stage = 1; // 1: Consent only, 2: Issued (ready to enter), 3: Inside, 4: Exited
      if (hasExited) stage = 4;
      else if (hasEntered) stage = 3;
      else if (isIssued) stage = 2;

      let actionHtml = '';

      // 고객이 보는 화면: 연락처·거주지는 표시하지 않고 성함은 가운데를 가린다
      const guardianMasked = maskName(guardian);
      const kidsCount = children.length;

      if (stage === 1) {
        playChime('error');
        actionHtml = `
          <div class="bg-rose-950/70 border border-rose-800 rounded-3xl p-5 text-center space-y-2">
            <i data-lucide="ticket" class="w-10 h-10 text-rose-400 mx-auto"></i>
            <div class="text-xl font-black text-white">매표소에서 발권을 먼저 받아 주세요</div>
            <p class="text-sm text-rose-200">서약은 완료되었어요. 매표소에서 이용권을 받으신 뒤 다시 찍어 주세요.</p>
          </div>
        `;
      } else if (stage === 2) {
        playChime('entry');
        actionHtml = `
          <div class="bg-emerald-950/70 border border-emerald-700 rounded-3xl p-5 space-y-4 text-center">
            <div>
              <div class="text-2xl font-black text-white">환영합니다! 🌿</div>
              <p class="text-sm text-emerald-200 mt-1">아래 버튼을 누르면 입장이 완료돼요. 안전하게 즐겁게 놀아요!</p>
            </div>
            <button onclick="executeGateAction('${rec.id}', 'entry')" class="w-full py-5 bg-emerald-500 hover:bg-emerald-400 active:scale-[0.99] text-slate-950 font-black text-lg rounded-2xl shadow-lg transition flex items-center justify-center gap-2">
              <i data-lucide="log-in" class="w-6 h-6"></i>
              <span>입장하기 (${totalPeople}명)</span>
            </button>
          </div>
        `;
      } else if (stage === 3) {
        playChime('exit');
        actionHtml = `
          <div class="bg-amber-950/60 border border-amber-700 rounded-3xl p-5 space-y-4 text-center">
            <div>
              <div class="text-2xl font-black text-white">벌써 가시나요?</div>
              <p class="text-sm text-amber-200 mt-1">${BongplaySync.toLocalTimeStr(rec.entry_at)}에 입장하셨어요. 아래 버튼을 누르면 퇴장이 완료돼요.</p>
            </div>
            <button onclick="executeGateAction('${rec.id}', 'exit')" class="w-full py-5 bg-amber-500 hover:bg-amber-400 active:scale-[0.99] text-slate-950 font-black text-lg rounded-2xl shadow-lg transition flex items-center justify-center gap-2">
              <i data-lucide="log-out" class="w-6 h-6"></i>
              <span>퇴장하기 (${totalPeople}명)</span>
            </button>
          </div>
        `;
      } else if (stage === 4) {
        if (!justExited) playChime('exit');
        const stay = rec.stay_duration_minutes;
        const stayText = (stay != null && stay >= 0) ? ` · ${Math.floor(stay / 60) ? Math.floor(stay / 60) + '시간 ' : ''}${stay % 60}분 머무셨어요` : '';
        actionHtml = `
          <div class="bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 flex items-center justify-between gap-2 text-slate-400">
            <div class="flex items-center gap-2 font-bold text-slate-200 text-sm">
              <i data-lucide="check-check" class="w-5 h-5 text-purple-400"></i>
              <span>${justExited ? '퇴장이 완료되었어요' : '이미 퇴장하신 이용권이에요'}${escapeHtml(stayText)}</span>
            </div>
            <span class="text-xs font-mono text-slate-400">${BongplaySync.toLocalTimeStr(rec.exit_at)}</span>
          </div>
          ${renderExitSurveyBlock(rec)}
        `;
      }

      const stageLabel = ['', '발권 전', '입장 전', '이용 중', '퇴장 완료'][stage];
      panel.innerHTML = `
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-xs font-extrabold px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">${stageLabel}</span>
              <span class="text-sm font-black font-mono text-brand-400">${escapeHtml(passCode)}</span>
            </div>
            <h4 class="text-xl sm:text-2xl font-black text-white mt-1.5">${escapeHtml(guardianMasked)} 님 가족</h4>
            <p class="text-sm text-slate-400 mt-0.5">보호자 1명 · 아이 ${kidsCount}명</p>
          </div>
          <button onclick="document.getElementById('scanResultPanel').classList.add('hidden')" class="p-2 text-slate-500 hover:text-white rounded-xl" aria-label="닫기">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        ${actionHtml}
      `;

      drawExitSurveyQr(passCode);
      lucide.createIcons();
    }

    /* ---- 퇴장 만족도 설문 (태블릿 즉석 응답 + 휴대폰 QR) ----
       퇴장 처리 후에도 다음 스캔 전까지 화면에 남아 있으므로, 손님이 태블릿을 한 번 누르거나
       휴대폰으로 QR 을 찍어 의견을 남길 수 있다. 이미 퇴장한 바우처를 다시 찍어도 표시된다. */
    const EXIT_SURVEY_FACES = [
      { score: 1, emoji: '😞', label: '별로예요' },
      { score: 2, emoji: '😕', label: '아쉬워요' },
      { score: 3, emoji: '🙂', label: '보통이에요' },
      { score: 4, emoji: '😀', label: '좋았어요' },
      { score: 5, emoji: '🤩', label: '최고예요' }
    ];
    // 3점 이하일 때만 묻는 "아쉬운 이유" — 코드값은 survey.html 의 improve 문항과 동일하게 맞춤
    const EXIT_SURVEY_REASONS = [
      { v: 'wait', emoji: '⏱', label: '대기 시간' },
      { v: 'facility', emoji: '🎢', label: '시설·놀이기구' },
      { v: 'toilet', emoji: '🚻', label: '청결·화장실' },
      { v: 'staff', emoji: '🙋', label: '직원 응대' },
      { v: 'price', emoji: '💰', label: '가격·매점' }
    ];

    function surveyedKey() {
      return 'bongplay_gate_surveyed_' + BongplaySync.toLocalDateStr(new Date());
    }
    function getSurveyedMap() {
      try { return JSON.parse(localStorage.getItem(surveyedKey()) || '{}'); } catch (e) { return {}; }
    }
    function getSurveyed(recId) {
      const v = getSurveyedMap()[recId];
      if (v == null) return null;
      return typeof v === 'object' ? v : { score: v, reason: 'skip' };   // 예전 형식(점수만) 호환
    }
    function markSurveyed(recId, info) {
      const map = getSurveyedMap();
      map[recId] = info;
      try { localStorage.setItem(surveyedKey(), JSON.stringify(map)); } catch (e) {}
    }

    // 휴대폰 설문 주소: 현재 주소에서 파일명을 글자 치환하지 않고 같은 폴더 기준으로 계산
    // (예전: pathname.replace('gate.html', …) → '.html' 없는 주소로 열리면 QR 이 게이트 자신을 가리켜 관리자 암호 창이 떴음)
    function buildSurveyUrl(passCode) {
      const u = new URL('survey.html', window.location.href);
      if (passCode) u.searchParams.set('pass', passCode);
      u.searchParams.set('ch', 'gate');
      return u.href;
    }

    function renderExitSurveyBlock(rec) {
      const done = getSurveyed(rec.id);
      const safeId = escapeHtml(String(rec.id).replace(/'/g, ''));
      // 태블릿에서 바로 정성 설문(선물 연계)을 여는 버튼 — 직원이 태블릿을 손님 쪽으로 돌려 진행
      const passForSurvey = escapeHtml(String(rec.passCode || rec.pass_code || '').replace(/'/g, ''));
      const fullDone = !!getFullSurveyDone(rec);
      const qrBox = fullDone
        ? `<div class="rounded-2xl bg-slate-900 border border-slate-700 p-3 text-sm text-slate-300">🎁 후기 설문 완료 · 선물 교환 번호 <b class="font-mono text-white">${escapeHtml(getFullSurveyDone(rec).gift || '-')}</b></div>`
        : `<button type="button" onclick="openFullSurvey('${passForSurvey}', '${safeId}')"
             class="w-full py-4 rounded-2xl bg-white text-slate-900 font-black text-base active:scale-[0.99] transition flex items-center justify-center gap-2 shadow">
             🎁 1분 후기 남기고 선물 받기
           </button>`;

      // 3점 이하를 누른 직후: 이유 한 번 더 (누르거나 건너뛰기)
      if (done && done.reason === null) {
        return `
          <div class="bg-purple-950/50 border border-purple-700/60 rounded-2xl p-5 space-y-4 text-center">
            <div>
              <div class="text-xl font-black text-white">무엇이 가장 아쉬우셨나요?</div>
              <div class="text-sm text-purple-200 mt-1">하나만 눌러 주시면 바로 개선할게요</div>
            </div>
            <div class="grid grid-cols-5 gap-2">
              ${EXIT_SURVEY_REASONS.map(r => `
                <button type="button" onclick="submitGateReason('${safeId}', '${r.v}')"
                  class="flex flex-col items-center gap-1 py-3 rounded-2xl bg-slate-900 border border-slate-700 hover:border-purple-400 active:scale-95 transition">
                  <span class="text-2xl sm:text-3xl leading-none">${r.emoji}</span>
                  <span class="text-[11px] font-bold text-slate-300 leading-tight">${r.label}</span>
                </button>`).join('')}
            </div>
            <button type="button" onclick="submitGateReason('${safeId}', 'skip')" class="text-sm text-slate-400 underline underline-offset-4">건너뛰기</button>
          </div>`;
      }

      if (done) {
        const face = EXIT_SURVEY_FACES.find(f => f.score === done.score) || EXIT_SURVEY_FACES[4];
        return `
          <div class="bg-purple-950/50 border border-purple-700/60 rounded-2xl p-5 space-y-4 text-center">
            <div class="text-5xl">${face.emoji}</div>
            <div>
              <div class="text-lg font-black text-white">소중한 의견 감사합니다!</div>
              <div class="text-sm text-purple-200 mt-1">안전한 귀갓길 되세요. 또 놀러 오세요 🌿</div>
            </div>
            ${qrBox}
          </div>`;
      }

      return `
        <div class="bg-purple-950/50 border border-purple-700/60 rounded-2xl p-5 space-y-4 text-center">
          <div>
            <div class="text-xl font-black text-white">오늘 즐거우셨나요?</div>
            <div class="text-sm text-purple-200 mt-1">얼굴을 한 번 눌러 주세요 · 10초면 끝나요</div>
          </div>
          <div class="grid grid-cols-5 gap-2">
            ${EXIT_SURVEY_FACES.map(f => `
              <button type="button" onclick="submitGateSurvey('${safeId}', ${f.score})"
                class="flex flex-col items-center gap-1 py-3 rounded-2xl bg-slate-900 border border-slate-700 hover:border-purple-400 active:scale-95 transition">
                <span class="text-3xl sm:text-4xl leading-none">${f.emoji}</span>
                <span class="text-[11px] font-bold text-slate-300">${f.label}</span>
              </button>`).join('')}
          </div>
          ${qrBox}
        </div>`;
    }

    // (휴대폰 QR 방식은 폐지 — 태블릿에서 바로 설문. 호출부 호환용으로 남겨 둠)
    function drawExitSurveyQr() {}

    /* ---- 태블릿 정성 설문 모달 (survey.html 을 창 안에 띄움) ---- */
    function fullSurveyDoneKey(pass) { return 'bongplay_survey_v2_done_' + pass; }
    function getFullSurveyDone(rec) {
      const pass = rec && (rec.passCode || rec.pass_code);
      if (!pass) return null;
      try { return JSON.parse(localStorage.getItem(fullSurveyDoneKey(pass)) || 'null'); } catch (e) { return null; }
    }

    let fullSurveyRecId = null;
    function openFullSurvey(passCode, recId) {
      fullSurveyRecId = recId;
      const modal = document.getElementById('fullSurveyModal');
      const frame = document.getElementById('fullSurveyFrame');
      // 방문 ID·서약 ID 를 함께 넘겨 체류시간·지출 데이터와 결합 분석이 가능하게 함 (개인정보 아님)
      const rec = consents.find(c => String(c.id).replace(/'/g, '') === recId);
      const u = new URL(buildSurveyUrl(passCode));
      if (rec && rec.visit_id) u.searchParams.set('visit', rec.visit_id);
      if (rec && rec.id) u.searchParams.set('cid', rec.id);
      u.searchParams.set('embed', '1');
      u.searchParams.set('t', String(Date.now()));   // 매번 새로 열어 이전 손님 응답이 남지 않게
      frame.src = u.href;
      modal.classList.remove('hidden');
    }

    function closeFullSurvey() {
      const modal = document.getElementById('fullSurveyModal');
      const frame = document.getElementById('fullSurveyFrame');
      modal.classList.add('hidden');
      frame.src = 'about:blank';
      const rec = consents.find(c => String(c.id).replace(/'/g, '') === fullSurveyRecId);
      if (rec) renderScanResult(rec, true);
      fullSurveyRecId = null;
      const input = document.getElementById('scannerInput');
      if (input) input.blur();
    }

    // 설문 창에서 보내는 신호 (완료 후 "처음 화면으로" / 닫기)
    window.addEventListener('message', (ev) => {
      if (ev.origin !== window.location.origin) return;
      if (ev.data && ev.data.type === 'bongplay-survey-close') closeFullSurvey();
    });

    function submitGateSurvey(recId, score) {
      const rec = consents.find(c => String(c.id).replace(/'/g, '') === recId);
      if (!rec || getSurveyed(rec.id)) return;
      let surveyId = null;
      // 점수는 누르는 즉시 저장 (이유를 안 누르고 가도 점수는 남도록)
      if (window.BongplayID && BongplayID.recordCustomerSurvey) {
        const s = BongplayID.recordCustomerSurvey({
          satisfaction_score: score,
          consent_id: rec.id,
          pass_code: rec.passCode || rec.pass_code || null,
          visit_id: rec.visit_id || null,
          household_id: rec.household_id || null,
          survey_channel: 'exit_tablet'
        });
        surveyId = s && s.id;
      }
      markSurveyed(rec.id, { score, survey_id: surveyId, reason: score <= 3 ? null : 'n/a' });
      playChime('entry');
      renderScanResult(rec, true);
    }

    function submitGateReason(recId, reason) {
      const rec = consents.find(c => String(c.id).replace(/'/g, '') === recId);
      const done = rec && getSurveyed(rec.id);
      if (!done || done.reason !== null) return;
      if (reason !== 'skip' && done.survey_id) {
        // 같은 설문 행에 이유만 덧붙임 (서버는 id 기준 병합)
        BongplaySync.upsert('customer_experience_surveys', { id: done.survey_id, improvement_reason: reason });
        try {
          const key = 'bongplay_customer_experience_surveys';
          const list = JSON.parse(localStorage.getItem(key) || '[]');
          const i = list.findIndex(s => s.id === done.survey_id);
          if (i >= 0) { list[i].improvement_reason = reason; localStorage.setItem(key, JSON.stringify(list)); }
        } catch (e) {}
      }
      markSurveyed(rec.id, Object.assign({}, done, { reason }));
      renderScanResult(rec, true);
    }

    function renderNotFound(code) {
      const panel = document.getElementById('scanResultPanel');
      panel.classList.remove('hidden');
      panel.innerHTML = `
        <div class="bg-rose-950/80 border border-rose-800 rounded-2xl p-4 text-center space-y-2">
          <i data-lucide="search-x" class="w-8 h-8 text-rose-400 mx-auto"></i>
          <h4 class="text-sm font-black text-white">일치하는 서약/발권 정보를 찾을 수 없습니다.</h4>
          <p class="text-xs text-rose-300 font-mono">입력 코드: ${escapeHtml(code)}</p>
          <p class="text-[11px] text-rose-400">손님에게 매표소에서 먼저 안전서약 및 발권을 받으시도록 안내해 주십시오.</p>
        </div>
      `;
      lucide.createIcons();
    }

    // 6. Execute Gate Action (Entry / Exit)
    async function executeGateAction(id, actionType) {
      const rec = consents.find(c => c.id === id);
      if (!rec) return;

      const now = new Date().toISOString();
      const totalPeople = ((rec.children && rec.children.length) || 0) + 1;

      if (actionType === 'entry') {
        rec.entry_at = now;
        playChime('entry');
        addActivityLog({
          time: BongplaySync.toLocalTimeStr(now),
          type: '입장 승인',
          pass: rec.passCode || rec.pass_code,
          guardian: rec.guardianName || rec.guardian_name,
          count: `+${totalPeople}명`,
          status: '원내 입장'
        });
      } else if (actionType === 'exit') {
        rec.exit_at = now;
        // 체류 시간(분): 객단가·매점 소비 분석의 핵심 설명 변수 (예전엔 계산되지 않아 항상 비어 있었음)
        if (rec.entry_at) {
          const mins = Math.round((new Date(now) - new Date(rec.entry_at)) / 60000);
          if (mins >= 0 && mins < 24 * 60) rec.stay_duration_minutes = mins;
        }
        playChime('exit');
        addActivityLog({
          time: BongplaySync.toLocalTimeStr(now),
          type: '퇴장 승인',
          pass: rec.passCode || rec.pass_code,
          guardian: rec.guardianName || rec.guardian_name,
          count: `-${totalPeople}명`,
          status: '퇴장 완료'
        });
      }

      // Save via BongplaySync
      await BongplaySync.upsert('safety_consents', rec);
      recalcOccupancy();
      renderScanResult(rec, actionType === 'exit');
    }

    // 출입 로그는 메모리에만 쌓지 않고, 저장된 서약서의 입장·퇴장 시각(entry_at / exit_at)에서
    // 매번 다시 만든다. → 새로고침해도 유지되고, 여러 태블릿이 같은 로그를 본다.
    function addActivityLog() {
      renderActivityLog();
    }

    function renderActivityLog() {
      const tbody = document.getElementById('activityLogBody');
      if (!tbody) return;
      const todayYmd = BongplaySync.toLocalDateStr(new Date());
      const events = [];
      consents.forEach(c => {
        const people = ((c.children && c.children.length) || 0) + 1;
        const base = { pass: c.passCode || c.pass_code || '-', guardian: c.guardianName || c.guardian_name || '-' };
        if (c.entry_at && BongplaySync.toLocalDateStr(new Date(c.entry_at)) === todayYmd) {
          events.push({ ...base, at: c.entry_at, type: '입장 승인', count: `+${people}명`, status: '원내 입장' });
        }
        if (c.exit_at && BongplaySync.toLocalDateStr(new Date(c.exit_at)) === todayYmd) {
          events.push({ ...base, at: c.exit_at, type: '퇴장 승인', count: `-${people}명`, status: '퇴장 완료' });
        }
      });
      events.sort((a, b) => new Date(b.at) - new Date(a.at));
      recentLogs = events.slice(0, 50);

      if (!recentLogs.length) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-500 font-sans">오늘 출입 기록이 없습니다. 스캔 대기 중입니다.</td></tr>`;
        return;
      }

      tbody.innerHTML = recentLogs.map(log => `
        <tr class="hover:bg-slate-800/40">
          <td class="py-2 px-3 text-slate-400">${BongplaySync.toLocalTimeStr(log.at)}</td>
          <td class="py-2 px-3">
            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${log.type === '입장 승인' ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' : 'bg-amber-950 text-amber-300 border border-amber-800'}">
              ${log.type}
            </span>
          </td>
          <td class="py-2 px-3 text-brand-400 font-bold">${escapeHtml(maskPass(log.pass))}</td>
          <td class="py-2 px-3 text-white font-sans">${escapeHtml(maskName(log.guardian))}</td>
          <td class="py-2 px-3 font-bold ${log.count.startsWith('+') ? 'text-emerald-400' : 'text-purple-400'}">${log.count}</td>
          <td class="py-2 px-3 text-slate-300 font-sans">${log.status}</td>
        </tr>
      `).join('');
    }

    // 7. 카메라 QR 스캐너 (손목 띠지 프린터 미도입 → 고객 스마트폰 바우처 QR 직접 판독)
    //    · 1순위: 브라우저 내장 BarcodeDetector (안드로이드 Chrome 등)
    //    · 2순위: jsQR 라이브러리 (미지원 브라우저 폴백)
    //    이전 코드는 영상만 띄우고 판독기가 없어 카메라 스캔이 동작하지 않았습니다.
    let scanLoopId = null;
    let lastDecoded = { code: '', at: 0 };
    let barcodeDetector = null;
    let jsQrLoading = null;

    function loadJsQr() {
      if (window.jsQR) return Promise.resolve(true);
      if (jsQrLoading) return jsQrLoading;
      jsQrLoading = new Promise((resolve) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
        s.onload = () => resolve(true);
        s.onerror = () => resolve(false);
        document.head.appendChild(s);
      });
      return jsQrLoading;
    }

    function handleDecoded(raw) {
      const now = Date.now();
      // 같은 코드가 카메라에 계속 잡히므로 3초 내 중복은 무시
      if (raw === lastDecoded.code && now - lastDecoded.at < 3000) return;
      lastDecoded = { code: raw, at: now };
      processScanCode(raw);   // 입장/퇴장 판정 후 해당 효과음이 재생됩니다
    }

    async function scanFrame() {
      const video = document.getElementById('cameraVideo');
      if (!cameraStream || !video || video.readyState !== video.HAVE_ENOUGH_DATA) {
        scanLoopId = requestAnimationFrame(scanFrame);
        return;
      }
      try {
        if (barcodeDetector) {
          const codes = await barcodeDetector.detect(video);
          if (codes && codes.length > 0 && codes[0].rawValue) handleDecoded(codes[0].rawValue.trim());
        } else if (window.jsQR) {
          const canvas = document.getElementById('scanCanvas');
          const w = video.videoWidth, h = video.videoHeight;
          if (w && h) {
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(video, 0, 0, w, h);
            const img = ctx.getImageData(0, 0, w, h);
            const result = jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' });
            if (result && result.data) handleDecoded(result.data.trim());
          }
        }
      } catch (e) { /* 프레임 단위 오류는 무시하고 계속 스캔 */ }
      scanLoopId = requestAnimationFrame(scanFrame);
    }

    async function toggleCameraScanner() {
      const container = document.getElementById('cameraPreviewContainer');
      const video = document.getElementById('cameraVideo');
      const btnText = document.getElementById('cameraBtnText');

      if (cameraStream) {
        if (scanLoopId) cancelAnimationFrame(scanLoopId);
        scanLoopId = null;
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
        container.classList.add('hidden');
        btnText.textContent = '카메라 켜기';
        try { localStorage.setItem('bongplay_gate_camera_on', '0'); } catch (e) {}
        return;
      }

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
        video.srcObject = cameraStream;
        container.classList.remove('hidden');
        btnText.textContent = '카메라 끄기';
        try { localStorage.setItem('bongplay_gate_camera_on', '1'); } catch (e) {}

        // 판독기 준비
        barcodeDetector = null;
        if ('BarcodeDetector' in window) {
          try {
            const formats = await window.BarcodeDetector.getSupportedFormats();
            const want = ['qr_code', 'code_128', 'code_39', 'ean_13'].filter(f => formats.includes(f));
            if (want.length) barcodeDetector = new window.BarcodeDetector({ formats: want });
          } catch (e) { barcodeDetector = null; }
        }
        if (!barcodeDetector) {
          const loaded = await loadJsQr();
          if (!loaded) {
            alert('QR 판독기를 불러오지 못했습니다(오프라인).\nUSB 스캐너 또는 접수번호 직접 입력을 사용해 주십시오.');
          }
        }
        scanFrame();
      } catch (e) {
        alert('카메라에 접근할 수 없습니다: ' + e.message);
      }
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(e => {});
      } else {
        document.exitFullscreen().catch(e => {});
      }
    }
  </script>
</body>
</html>
